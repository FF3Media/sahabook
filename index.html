<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahabook</title>
<meta name="description" content="Learn to read and understand Al-Fatiha and the last 15 surahs.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sahabook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand"><span class="mark">ق</span>Sahabook</div>
    <nav class="seg" role="tablist" aria-label="Sections">
      <button role="tab" data-view="letters" aria-selected="true">Letters</button>
      <button role="tab" data-view="read" aria-selected="false">Read</button>
      <button role="tab" data-view="progress" aria-selected="false">Progress</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <p class="empty" id="loading">Loading…</p>
</main>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button role="tab" data-view="letters" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Letters</button>
  <button role="tab" data-view="read" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5zM12 6v13"/></svg>Read</button>
  <button role="tab" data-view="progress" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg>Progress</button>
</nav>

<script src="app.js"></script>
</body>
</html>
